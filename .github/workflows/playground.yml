name: Playground

on:
  pull_request:
    branches: [master]
    paths:
      - 'playground/**'
      - '.github/workflows/playground.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: '24'
      - name: Build Transform
        run: npm run build
      - name: Install playground dependencies
        working-directory: playground
        run: npm ci
      - name: Validate playground
        working-directory: playground
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run pages
          npm run bundle
