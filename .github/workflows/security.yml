# Locally maintained for Transform 5 branch coverage; excluded in .infrarc.yml.
# Keep jobs aligned with @diplodoc/infra scaffolding and review upstream changes.
# Use infra sync for infrastructure updates; legacy infra/lint update bypass exclusions.
name: Security

on:
  push:
    branches: [master, 'codex/transform-5-major']
  pull_request:
    branches: [master, 'codex/transform-5-major']
  schedule:
    # Run weekly security scan on Monday at 6:00 UTC
    - cron: '0 6 * * 1'

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Run npm audit
        id: audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Upload audit results
        if: steps.audit.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-report
          path: |
            package-lock.json
          retention-days: 7
