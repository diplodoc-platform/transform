name: SVG package regression

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: '24'
      - run: npm run test:package
